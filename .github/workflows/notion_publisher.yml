name: Daily Notion Publisher

on:
  schedule:
    # 毎日午前9時（UTC+9で翌朝）に実行
    - cron: '0 0 * * *'
  workflow_dispatch:  # 手動トリガー用

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        working-directory: ./リサーチ
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create .env file
        working-directory: ./リサーチ
        run: |
          cat > config/.env << EOF
          MAKE_WEBHOOK_URL=${{ secrets.MAKE_WEBHOOK_URL }}
          NOTION_API_KEY=${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID=${{ secrets.NOTION_DATABASE_ID }}
          ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}
          EOF

      - name: Collect RSS articles
        working-directory: ./リサーチ
        run: python3 src/collectors/rss_collector.py

      - name: Publish to Notion
        working-directory: ./リサーチ
        run: python3 src/processors/notion_publisher.py

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: execution-logs
          path: ./リサーチ/data/processed/
