name: Daily Notion Publisher

on:
  schedule:
    - cron: '0 21 * * *'  # UTC 21:00 (Japan 6am)
  workflow_dispatch:

env:
  LANG: C.UTF-8
  LC_ALL: C.UTF-8

jobs:
  notion-publisher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests python-dotenv feedparser

      - name: Collect RSS articles
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
        run: |
          find . -name "rss_collector.py" -type f -exec python {} \;

      - name: Process with Claude and publish to Notion
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
        run: |
          find . -name "notion_publisher.py" -path "*/processors/*" -type f -exec python {} \;

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notion-publisher-logs
          path: /tmp/notion_output.log
          retention-days: 7
