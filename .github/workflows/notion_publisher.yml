name: Daily Notion Publisher

on:
  schedule:
    - cron: '0 21 * * *'  # UTC 21:00 (Japan 6am)
  workflow_dispatch:

jobs:
  notion-publisher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Debug - Show directory structure
        run: |
          echo "=== Repository root ==="
          ls -la
          echo ""
          echo "=== Contents of repository ==="
          find . -maxdepth 2 -type d | head -20
          echo ""
          echo "=== Current working directory ==="
          pwd

      - name: Set up Python 3.9
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f new-silkroad-agent/リサーチ/requirements.txt ]; then
            pip install -r new-silkroad-agent/リサーチ/requirements.txt
          elif [ -f リサーチ/requirements.txt ]; then
            pip install -r リサーチ/requirements.txt
          else
            echo "requirements.txt not found"
            exit 1
          fi

      - name: Create .env file
        run: |
          RESEARCH_DIR=""
          if [ -d "new-silkroad-agent/リサーチ" ]; then
            RESEARCH_DIR="new-silkroad-agent/リサーチ"
          elif [ -d "リサーチ" ]; then
            RESEARCH_DIR="リサーチ"
          else
            echo "リサーチ directory not found"
            exit 1
          fi
          
          cat > "$RESEARCH_DIR/config/.env" << 'ENVEOF'
          MAKE_WEBHOOK_URL=${{ secrets.MAKE_WEBHOOK_URL }}
          NOTION_API_KEY=${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID=${{ secrets.NOTION_DATABASE_ID }}
          ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}
          ENVEOF

      - name: Collect RSS articles
        run: |
          if [ -d "new-silkroad-agent/リサーチ" ]; then
            python new-silkroad-agent/リサーチ/src/collectors/rss_collector.py
          else
            python リサーチ/src/collectors/rss_collector.py
          fi

      - name: Process with Claude and publish to Notion
        run: |
          if [ -d "new-silkroad-agent/リサーチ" ]; then
            python new-silkroad-agent/リサーチ/src/processors/notion_publisher.py
          else
            python リサーチ/src/processors/notion_publisher.py
          fi

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notion-publisher-logs
          path: /tmp/notion_output.log
          retention-days: 7
